name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  rust:
    name: Rust build
    runs-on: ci-rust
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Build
        run: cargo build --locked
