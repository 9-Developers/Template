name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  semgrep:
    name: Semgrep
    runs-on: ci-security
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Semgrep scan
        run: >-
          semgrep
          scan
          --config auto
          --sarif
          --sarif-output=semgrep.sarif
          --text
          --error
          ${{ forgejo.workspace }}

      - name: Upload report
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4.3.1
        with:
          name: semgrep
          path: semgrep.sarif

  socket:
    name: Socket
    runs-on: ci-security
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Scan dependencies
        run: socket ci --org 9-developers
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_KEY }}

  trivy-blocking:
    name: Trivy (blocking)
    runs-on: ci-security
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository
        run: >-
          trivy
          fs
          --exit-code 1
          --severity HIGH,CRITICAL
          --scanners license,misconfig,secret,vuln
          ${{ forgejo.workspace }}

  trivy-report:
    name: Trivy (report)
    runs-on: ci-security
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository
        run: >-
          trivy
          fs
          --scanners license,misconfig,secret,vuln
          --format sarif
          --output trivy.sarif
          ${{ forgejo.workspace }}

      - name: Upload report
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4.3.1
        with:
          name: trivy
          path: trivy.sarif
